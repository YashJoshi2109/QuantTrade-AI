# ============================================
# QuantTrade AI - Push-to-Deploy CI/CD Pipeline
# ============================================
# 
# Triggers on push to main branch
# Builds Docker images in GitHub Actions
# Pushes to GitHub Container Registry (GHCR)
# Deploys to EC2 via SSH
#
# Required GitHub Secrets:
#   - EC2_HOST: EC2 public IP or hostname
#   - EC2_USER: SSH username (ubuntu)
#   - EC2_SSH_KEY: Private SSH key for EC2
#   - GHCR_TOKEN: GitHub token for container registry (or use GITHUB_TOKEN)
#   - BREVO_API_KEY + BREVO_FROM_EMAIL: transactional email (OTP, login alert, welcome promo)
#   - RESEND_API_KEY + RESEND_FROM_EMAIL (optional): fallback + dual-path delete-account OTP when both set
#
# Production behavior:
#   - Frontend image: NEXT_PUBLIC_STRIPE_* + promo code baked in at build (see build-args below).
#   - Backend: APP_URL + welcome promo defaults via docker-compose.prod.yml + .env; DB column
#     welcome_promo_email_sent_at applied automatically after deploy (idempotent script).
# ============================================

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

# One production deploy at a time, in push order. Two overlapping runs used to
# race twice: both pushed the same :latest tag (an older build could land last
# and roll prod back) and both ran `docker compose up` on the same host.
# A newer queued run replaces an older *pending* one (main is cumulative); a
# run that is already deploying is never cancelled mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/quanttrade-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/quanttrade-backend

jobs:
  # ==========================================
  # Build and Push Docker Images
  # ==========================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove unnecessary large packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          sudo apt-get clean
          echo "After cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=https://www.quanttrade.us
            NEXT_PUBLIC_GTM_ID=GTM-KWMSXH37
            NEXT_PUBLIC_GA_MEASUREMENT_ID=G-7X19HSHVQD
            NEXT_PUBLIC_STRIPE_PAYMENT_LINK_MONTHLY=https://buy.stripe.com/dRmbJ2ae80Y2aw36KU7Re01
            NEXT_PUBLIC_STRIPE_PAYMENT_LINK_YEARLY=https://buy.stripe.com/4gM3cwae8bCG7jRd9i7Re02
            NEXT_PUBLIC_STRIPE_PROMO_CODE=QUANTTRADE
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  # ==========================================
  # Deploy to EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/"
          target: "/opt/quanttrade"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          APILAYER_CURRENCY_KEY: ${{ secrets.APILAYER_CURRENCY_KEY }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PUBLIC_API_SECRET_KEY: ${{ secrets.PUBLIC_API_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_THIN_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_THIN_WEBHOOK_SECRET }}
          STRIPE_CONNECT_SUBSCRIPTION_PRICE_ID: ${{ secrets.STRIPE_CONNECT_SUBSCRIPTION_PRICE_ID }}
          STRIPE_PRICE_PLUS_MONTHLY: ${{ secrets.STRIPE_PRICE_PLUS_MONTHLY }}
          STRIPE_PRICE_PLUS_YEARLY: ${{ secrets.STRIPE_PRICE_PLUS_YEARLY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_OPENROUTER_API_KEY: ${{ secrets.NEXT_PUBLIC_OPENROUTER_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          NASA_FIRMS_API_KEY: ${{ secrets.NASA_FIRMS_API_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_VOICE_NARRATOR: ${{ secrets.ELEVENLABS_VOICE_NARRATOR }}
          ELEVENLABS_VOICE_KNIGHT: ${{ secrets.ELEVENLABS_VOICE_KNIGHT }}
          ELEVENLABS_VOICE_SCHOLAR: ${{ secrets.ELEVENLABS_VOICE_SCHOLAR }}
          ELEVENLABS_VOICE_MERCHANT: ${{ secrets.ELEVENLABS_VOICE_MERCHANT }}
          ELEVENLABS_VOICE_NOBLE: ${{ secrets.ELEVENLABS_VOICE_NOBLE }}
          ELEVENLABS_VOICE_SAGE: ${{ secrets.ELEVENLABS_VOICE_SAGE }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          USE_LOCAL_STORAGE: ${{ secrets.USE_LOCAL_STORAGE }}
          # === Agentic RAG ===
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          # === Market Data ===
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Turnstile: the secret must pair with the site key baked into the
          # frontend build above (both GitHub secrets). Without this, the
          # backend fell back to a different Secrets Manager value and the
          # frontend had no site key, so every email sign-in failed CAPTCHA.
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ML_CALLBACK_SECRET: ${{ secrets.ML_CALLBACK_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SECRET_KEY,OPENAI_API_KEY,ANTHROPIC_API_KEY,NEWSAPI_KEY,ALPHA_VANTAGE_API_KEY,SEC_API_KEY,FINNHUB_API_KEY,FMP_API_KEY,EODHD_API_KEY,APILAYER_CURRENCY_KEY,MARKETSTACK_API_KEY,OPENFIGI_API_KEY,TWELVEDATA_API_KEY,PUBLIC_API_SECRET_KEY,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_CONNECT_THIN_WEBHOOK_SECRET,STRIPE_CONNECT_SUBSCRIPTION_PRICE_ID,STRIPE_PRICE_PLUS_MONTHLY,STRIPE_PRICE_PLUS_YEARLY,GUARDIAN_API_KEY,ACLED_API_KEY,ACLED_EMAIL,ACLED_PASSWORD,FRED_API_KEY,EIA_API_KEY,CLOUDFLARE_RADAR_TOKEN,GROQ_API_KEY,OPENROUTER_API_KEY,NEXT_PUBLIC_OPENROUTER_API_KEY,NASA_API_KEY,NASA_FIRMS_API_KEY,USGS_API_KEY,ELEVENLABS_API_KEY,ELEVENLABS_MODEL_ID,ELEVENLABS_VOICE_NARRATOR,ELEVENLABS_VOICE_KNIGHT,ELEVENLABS_VOICE_SCHOLAR,ELEVENLABS_VOICE_MERCHANT,ELEVENLABS_VOICE_NOBLE,ELEVENLABS_VOICE_SAGE,BREVO_API_KEY,BREVO_FROM_EMAIL,RESEND_API_KEY,RESEND_FROM_EMAIL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NEXT_PUBLIC_GOOGLE_CLIENT_ID,S3_ENDPOINT,S3_ACCESS_KEY,S3_SECRET_KEY,S3_BUCKET,S3_PUBLIC_URL,USE_LOCAL_STORAGE,COHERE_API_KEY,QDRANT_URL,QDRANT_API_KEY,ADMIN_EMAILS,ALPACA_API_KEY,ALPACA_SECRET_KEY,ML_CALLBACK_SECRET,TURNSTILE_SECRET_KEY
          # No script_stop: it appends an exit-code check after every line, and the
          # check placed after `else` sees the failed `if` test ($?=1) and exits.
          # Every deploy where nginx.conf was unchanged died silently right after
          # the container swap (skipping the nginx reload and all migrations).
          # `set -e` below stops on real failures and handles if/else correctly.
          script: |
            set -e
            
            # Navigate to deployment directory
            cd /opt/quanttrade
            
            # ===== WRITE .env FROM GITHUB SECRETS =====
            echo "🔐 Writing .env from GitHub Secrets..."
            
            # Build .env file — use || true to prevent set -e from killing on empty vars
            : > .env
            echo "# Auto-generated by GitHub Actions deploy" >> .env
            echo "# Last updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env
            
            # Helper: safely write KEY=VALUE to .env (single-quoted to prevent shell expansion)
            write_env() {
              local key="$1"
              local val="$2"
              if [ -n "$val" ]; then
                printf '%s=%s\n' "$key" "$val" >> .env
              fi
            }
            
            # === Database ===
            # DATABASE_URL is intentionally NOT written here. It is sourced at runtime
            # from AWS Secrets Manager (quanttrade/backend) via inject_aws_secrets()
            # in app/main.py and app/tasks/celery_app.py. EC2 role QuantTradeEC2Role
            # has SecretsManagerReadWrite. (Migrated PostgreSQL → RDS, 2026-06-23.)
            echo "# === Security ===" >> .env
            write_env "SECRET_KEY" "$SECRET_KEY"
            echo "# === API Keys ===" >> .env
            write_env "OPENAI_API_KEY" "$OPENAI_API_KEY"
            write_env "ANTHROPIC_API_KEY" "$ANTHROPIC_API_KEY"
            write_env "NEWSAPI_KEY" "$NEWSAPI_KEY"
            write_env "ALPHA_VANTAGE_API_KEY" "$ALPHA_VANTAGE_API_KEY"
            write_env "SEC_API_KEY" "$SEC_API_KEY"
            write_env "FINNHUB_API_KEY" "$FINNHUB_API_KEY"
            write_env "FMP_API_KEY" "$FMP_API_KEY"
            write_env "EODHD_API_KEY" "$EODHD_API_KEY"
            write_env "APILAYER_CURRENCY_KEY" "$APILAYER_CURRENCY_KEY"
            write_env "MARKETSTACK_API_KEY" "$MARKETSTACK_API_KEY"
            write_env "OPENFIGI_API_KEY" "$OPENFIGI_API_KEY"
            write_env "TWELVEDATA_API_KEY" "$TWELVEDATA_API_KEY"
            write_env "PUBLIC_API_SECRET_KEY" "$PUBLIC_API_SECRET_KEY"
            echo "# === Stripe ===" >> .env
            write_env "STRIPE_SECRET_KEY" "$STRIPE_SECRET_KEY"
            write_env "STRIPE_PUBLISHABLE_KEY" "$STRIPE_PUBLISHABLE_KEY"
            write_env "STRIPE_WEBHOOK_SECRET" "$STRIPE_WEBHOOK_SECRET"
            write_env "STRIPE_CONNECT_THIN_WEBHOOK_SECRET" "$STRIPE_CONNECT_THIN_WEBHOOK_SECRET"
            write_env "STRIPE_CONNECT_SUBSCRIPTION_PRICE_ID" "$STRIPE_CONNECT_SUBSCRIPTION_PRICE_ID"
            write_env "STRIPE_PRICE_PLUS_MONTHLY" "$STRIPE_PRICE_PLUS_MONTHLY"
            write_env "STRIPE_PRICE_PLUS_YEARLY" "$STRIPE_PRICE_PLUS_YEARLY"
            echo "STRIPE_BILLING_PORTAL_CONFIGURATION_ID=bpc_1TK4TgLE7UInSceyq0wyy4ES" >> .env
            echo "BILLING_PORTAL_RETURN_URL=https://www.quanttrade.us/settings" >> .env
            echo "# === Global Monitor ===" >> .env
            printf '%s=%s\n' "GUARDIAN_API_KEY" "${GUARDIAN_API_KEY:-test}" >> .env
            write_env "ACLED_API_KEY" "$ACLED_API_KEY"
            write_env "ACLED_EMAIL" "$ACLED_EMAIL"
            write_env "ACLED_PASSWORD" "$ACLED_PASSWORD"
            write_env "FRED_API_KEY" "$FRED_API_KEY"
            write_env "EIA_API_KEY" "$EIA_API_KEY"
            write_env "CLOUDFLARE_RADAR_TOKEN" "$CLOUDFLARE_RADAR_TOKEN"
            write_env "GROQ_API_KEY" "$GROQ_API_KEY"
            write_env "OPENROUTER_API_KEY" "$OPENROUTER_API_KEY"
            write_env "NEXT_PUBLIC_OPENROUTER_API_KEY" "$NEXT_PUBLIC_OPENROUTER_API_KEY"
            write_env "NASA_API_KEY" "$NASA_API_KEY"
            write_env "NASA_FIRMS_API_KEY" "$NASA_FIRMS_API_KEY"
            write_env "USGS_API_KEY" "$USGS_API_KEY"
            echo "# === ElevenLabs ===" >> .env
            write_env "ELEVENLABS_API_KEY" "$ELEVENLABS_API_KEY"
            write_env "ELEVENLABS_MODEL_ID" "$ELEVENLABS_MODEL_ID"
            write_env "ELEVENLABS_VOICE_NARRATOR" "$ELEVENLABS_VOICE_NARRATOR"
            write_env "ELEVENLABS_VOICE_KNIGHT" "$ELEVENLABS_VOICE_KNIGHT"
            write_env "ELEVENLABS_VOICE_SCHOLAR" "$ELEVENLABS_VOICE_SCHOLAR"
            write_env "ELEVENLABS_VOICE_MERCHANT" "$ELEVENLABS_VOICE_MERCHANT"
            write_env "ELEVENLABS_VOICE_NOBLE" "$ELEVENLABS_VOICE_NOBLE"
            write_env "ELEVENLABS_VOICE_SAGE" "$ELEVENLABS_VOICE_SAGE"
            echo "# === Email / Auth (Brevo + optional Resend) ===" >> .env
            write_env "BREVO_API_KEY" "$BREVO_API_KEY"
            write_env "BREVO_FROM_EMAIL" "$BREVO_FROM_EMAIL"
            write_env "RESEND_API_KEY" "$RESEND_API_KEY"
            write_env "RESEND_FROM_EMAIL" "$RESEND_FROM_EMAIL"
            write_env "GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_ID"
            write_env "GOOGLE_CLIENT_SECRET" "$GOOGLE_CLIENT_SECRET"
            write_env "NEXT_PUBLIC_GOOGLE_CLIENT_ID" "$NEXT_PUBLIC_GOOGLE_CLIENT_ID"
            echo "# === Cloudflare R2 Storage ===" >> .env
            write_env "S3_ENDPOINT" "$S3_ENDPOINT"
            write_env "S3_ACCESS_KEY" "$S3_ACCESS_KEY"
            write_env "S3_SECRET_KEY" "$S3_SECRET_KEY"
            write_env "S3_BUCKET" "$S3_BUCKET"
            write_env "S3_PUBLIC_URL" "$S3_PUBLIC_URL"
            write_env "USE_LOCAL_STORAGE" "$USE_LOCAL_STORAGE"
            echo "# === Agentic RAG (Qdrant + Cohere + Admin) ===" >> .env
            write_env "COHERE_API_KEY" "$COHERE_API_KEY"
            write_env "QDRANT_URL" "$QDRANT_URL"
            write_env "QDRANT_API_KEY" "$QDRANT_API_KEY"
            write_env "ADMIN_EMAILS" "$ADMIN_EMAILS"
            echo "# === Market Data (Alpaca) ===" >> .env
            write_env "ALPACA_API_KEY" "$ALPACA_API_KEY"
            write_env "ALPACA_SECRET_KEY" "$ALPACA_SECRET_KEY"
            write_env "TURNSTILE_SECRET_KEY" "$TURNSTILE_SECRET_KEY"
            echo "# === ML Pipeline ===" >> .env
            write_env "ML_CALLBACK_SECRET" "$ML_CALLBACK_SECRET"
            echo "FASTAPI_INTERNAL_URL=https://www.quanttrade.us" >> .env
            echo "# === App Settings ===" >> .env
            echo "DEBUG=false" >> .env
            echo "LOG_LEVEL=INFO" >> .env
            # Bedrock now uses cross-region inference profiles (us.anthropic.*), so the
            # hard PREFER_OPENAI=1 is gone; set it in Secrets Manager only as an emergency switch.
            # Embeddings stay pinned to one model regardless of LLM provider.
            echo "EMBED_MODEL=openai:text-embedding-3-small:1536" >> .env
            echo "AWS_REGION=us-east-2" >> .env
            echo "# === WebAuthn / Passkey (required for production verification) ===" >> .env
            echo "WEBAUTHN_RP_ID=quanttrade.us" >> .env
            echo "WEBAUTHN_ORIGIN=https://www.quanttrade.us" >> .env
            echo "WEBAUTHN_ORIGINS=https://www.quanttrade.us,https://quanttrade.us" >> .env
            echo "" >> .env
            echo "# === Welcome promo email (matches Stripe promotion code QUANTTRADE) ===" >> .env
            echo "STRIPE_WELCOME_PROMO_CUSTOMER_CODE=QUANTTRADE" >> .env
            echo 'STRIPE_WELCOME_PROMO_AMOUNT_LABEL=$15' >> .env

            chmod 600 .env
            echo "✅ .env written with $(wc -l < .env) lines"
            
            # Debug: verify critical secrets arrived
            # DATABASE_URL is NOT expected in .env — backend/celery load it from AWS Secrets Manager.
            # Single line that always exits 0 (set -e aborts on any non-zero command).
            echo "ℹ️ DATABASE_URL source: AWS Secrets Manager (quanttrade/backend); in .env: $(grep -c '^DATABASE_URL=' .env || true)"
            
            # ===== STOP SYSTEM SERVICES THAT MAY USE PORT 80/443 =====
            echo "🛑 Stopping any system nginx/apache..."
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true
            sudo systemctl stop apache2 2>/dev/null || true
            sudo systemctl disable apache2 2>/dev/null || true
            
            # ===== PULL WHILE THE OLD STACK KEEPS SERVING =====
            # Deploys used to `down` the stack first and pull ~1.5 GB of images
            # while the site returned Cloudflare 521. Pull first, then swap
            # containers in place; only fall back to a full reset if that fails.
            echo "🔐 Logging into GitHub Container Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Free space BEFORE pulling. Pruning unused images/build cache is safe
            # while the stack runs (images used by running containers are kept).
            # Without this, failed deploys never reach the post-deploy prune and
            # images pile up: 2026-11-26 the disk hit 89% (3.2 GB free) and the
            # pull died with "failed to extract layer", taking prod down.
            echo "Disk space before cleanup:"
            df -h /
            docker image prune -af --filter "until=24h" || true
            docker builder prune -af || true
            avail_kb=$(df --output=avail / | tail -1 | tr -d ' ')
            if [ "${avail_kb:-0}" -lt 6000000 ]; then
              echo "⚠️ <6 GB free after age-filtered prune — pruning all unused images"
              docker image prune -af || true
            fi
            echo "Disk space available:"
            df -h /
            avail_kb=$(df --output=avail / | tail -1 | tr -d ' ')
            if [ "${avail_kb:-0}" -lt 4000000 ]; then
              echo "❌ Less than 4 GB free; refusing to pull (the old stack keeps serving)"
              exit 1
            fi
            # nginx resolves the backend/frontend upstream names once, at
            # (re)load. If a container is recreated it can get a new IP (on
            # 2026-11-26 backend and frontend swapped .2/.4) and nginx keeps
            # proxying to the stale address -> 502 everywhere, even though every
            # container reports healthy. Always re-resolve on exit, including
            # when a later step fails and the script exits early.
            refresh_nginx() {
              docker exec quanttrade-nginx nginx -s reload >/dev/null 2>&1 \
                && echo "🔄 nginx reloaded (upstreams re-resolved)" \
                || echo "⚠️ nginx reload on exit failed"
            }
            trap refresh_nginx EXIT

            echo "📥 Pulling latest images (old stack still serving)..."
            docker compose -f docker-compose.prod.yml pull

            echo "💾 Memory before swap:"
            free -m || true

            dump_diagnostics() {
              docker compose -f docker-compose.prod.yml ps || true
              echo "=== Backend logs (last 150) ==="
              docker compose -f docker-compose.prod.yml logs --tail=150 backend || true
              echo "=== Frontend logs (last 50) ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 frontend || true
              echo "=== News worker logs (last 80) ==="
              docker compose -f docker-compose.prod.yml logs --tail=80 news-worker || true
              echo "=== Nginx logs (last 30) ==="
              docker compose -f docker-compose.prod.yml logs --tail=30 nginx || true
              echo "=== Memory ==="
              free -m || true
              docker stats --no-stream || true
              echo "=== dmesg OOM ==="
              sudo dmesg | grep -i "oom\|killed process\|out of memory" | tail -20 || true
            }

            # ===== IN-PLACE SWAP (only changed services are recreated) =====
            # --wait blocks until every service with a healthcheck is healthy
            # (backend uses /health/ready, so it is warm before it counts).
            echo "🚀 Swapping containers in place (timeout 600s)..."
            if docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 600 --remove-orphans; then
              echo "✅ In-place swap healthy"
            else
              echo "⚠️ In-place swap failed — diagnostics, then full reset"
              dump_diagnostics
              docker compose -f docker-compose.prod.yml down --remove-orphans --timeout 30 || true
              docker rm -f quanttrade-backend quanttrade-frontend quanttrade-nginx quanttrade-celery-worker quanttrade-news-worker 2>/dev/null || true
              sudo systemctl stop nginx apache2 2>/dev/null || true
              sudo fuser -k 80/tcp 443/tcp 2>/dev/null || true
              sleep 2
              if ! docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 600 --remove-orphans; then
                echo "❌ docker compose up --wait failed after full reset"
                dump_diagnostics
                exit 1
              fi
            fi

            # nginx.conf is a single-file bind mount. The deploy replaces the host
            # file (new inode), but a running container keeps the OLD inode, so
            # `nginx -s reload` would re-read stale config (#93's WebSocket block
            # never went live this way). Recreate nginx when the file changed;
            # otherwise reload, since nginx resolves backend/frontend once at
            # startup and recreated containers get new IPs.
            host_sum=$(sha256sum nginx/nginx.conf | cut -d' ' -f1)
            live_sum=$(docker exec quanttrade-nginx sha256sum /etc/nginx/nginx.conf 2>/dev/null | cut -d' ' -f1)
            if [ "$host_sum" != "$live_sum" ]; then
              echo "🔁 nginx.conf changed — recreating nginx"
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate nginx || true
            else
              docker exec quanttrade-nginx nginx -s reload \
                || docker compose -f docker-compose.prod.yml restart nginx || true
            fi
            echo "✅ All services healthy!"

            # Migration scripts import app.db.database directly; prod's DATABASE_URL
            # comes from AWS Secrets Manager, which only the app loads at startup,
            # so load it first and then run the script as __main__.
            # ===== DB: welcome promo dedupe column (idempotent; required for welcome email) =====
            echo "🧱 Applying DB migration welcome_promo_email_sent_at (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/add_welcome_promo_email_column.py', run_name='__main__')" \
              || echo "⚠️ Migration script failed — run on PostgreSQL: ALTER TABLE users ADD COLUMN IF NOT EXISTS welcome_promo_email_sent_at TIMESTAMP;"

            echo "🧱 Applying DB migration preferences_json (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/add_user_preferences_column.py', run_name='__main__')" \
              || echo "⚠️ preferences_json migration failed — run on PostgreSQL: ALTER TABLE users ADD COLUMN IF NOT EXISTS preferences_json TEXT;"

            echo "🧱 Applying DB migration portfolio_snapshots history columns (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/add_portfolio_snapshot_columns.py', run_name='__main__')" \
              || echo "⚠️ portfolio_snapshots migration failed — run scripts/add_portfolio_snapshot_columns.py manually"

            echo "🧱 Applying DB migration price_alerts.last_event_key (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/add_price_alert_event_key_column.py', run_name='__main__')" \
              || echo "⚠️ last_event_key migration failed — run on PostgreSQL: ALTER TABLE price_alerts ADD COLUMN IF NOT EXISTS last_event_key VARCHAR(32);"
            
            echo "🧱 Applying DB migration marketwatch_lists / marketwatch_items (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/create_marketwatch_tables.py', run_name='__main__')" \
              || echo "⚠️ marketwatch migration failed — run scripts/create_marketwatch_tables.py manually"

            echo "🧱 Applying DB migration price_bars unique (symbol_id, timestamp) (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/add_price_bars_unique_index.py', run_name='__main__')" \
              || echo "⚠️ price_bars unique-index migration failed — run scripts/add_price_bars_unique_index.py manually"

            echo "🧱 Applying DB migration report_results table (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/create_report_results_table.py', run_name='__main__')" \
              || echo "⚠️ report_results migration failed — run scripts/create_report_results_table.py manually"

            echo "🧱 Applying DB migration symbols lifecycle columns + retired tickers (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/add_symbol_lifecycle_columns.py', run_name='__main__')" \
              || echo "⚠️ symbols lifecycle migration failed — run scripts/add_symbol_lifecycle_columns.py manually"

            echo "🧱 Applying DB migration community bot tables + bot accounts (if missing)..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "from app.config_aws import inject_aws_secrets; inject_aws_secrets(); import runpy; runpy.run_path('scripts/seed_community_bots.py', run_name='__main__')" \
              || echo "⚠️ community bots migration failed — run scripts/seed_community_bots.py manually"

            # ===== POST-DEPLOY CLEANUP =====
            echo "🧹 Post-deploy cleanup..."
            docker image prune -af || true
            docker builder prune -af || true
            
            # Show running containers
            echo "📊 Running containers:"
            docker ps
            
            echo "✅ Deployment complete hogaya hai bhai !!"

  # ==========================================
  # Post-Deploy Health Check
  # ==========================================
  health-check:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Verify prod runs this commit
        # /health reports the git SHA baked into the backend image. Fail the
        # run if prod does not serve exactly this commit within 5 minutes:
        # catches out-of-order image pushes and half-applied deploys.
        run: |
          want="${{ github.sha }}"
          for i in $(seq 1 30); do
            got=$(curl -sL -m 10 https://quanttrade.us/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            echo "attempt $i: prod=${got:-unreachable} want=${want:0:12}"
            if [ "$got" = "$want" ]; then
              echo "✅ prod is serving ${want:0:12}"
              # Non-fatal: flag rejected email keys (signup OTP / password reset break silently).
              email=$(curl -sL -m 15 https://quanttrade.us/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('checks',{}).get('email',''))" 2>/dev/null || true)
              if [ "$email" = "degraded" ]; then echo "::warning::email provider keys rejected — rotate BREVO_API_KEY/RESEND_API_KEY GitHub secrets"; fi
              exit 0
            fi
            sleep 10
          done
          echo "::error::prod is not serving ${want:0:12} (last seen: ${got:-unreachable})"
          exit 1

      - name: Check Frontend Health
        run: |
          curl -L -f https://quanttrade.us/ || \
          curl -L -f http://quanttrade.us/ || \
          curl -L -f http://${{ secrets.EC2_HOST }}:3000/ || \
          echo "::warning::Frontend health check inconclusive"
