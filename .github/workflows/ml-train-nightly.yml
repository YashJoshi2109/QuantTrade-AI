name: ML Train Nightly

on:
  schedule:
    - cron: '0 3 * * 1-5'   # Weekdays 03:00 UTC — train tier_2 (~230 stocks)
    - cron: '0 3 * * 0'      # Sunday 03:00 UTC — full retrain via 5 parallel shard jobs
  workflow_dispatch:
    inputs:
      symbol_tier:
        description: 'Symbol tier: tier_1 | tier_2 | tier_3 | all | tier_1_exclusive | tier_2_exclusive | tier_3a | tier_3b | tier_3c'
        default: 'tier_2'
      epochs:
        description: 'Override epochs (default from config)'
        default: ''
      force:
        description: 'Force retrain even without drift'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  # ── Determine training shards ─────────────────────────────────────
  plan:
    name: Plan training shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      run_id: ${{ steps.set-matrix.outputs.run_id }}
    steps:
      - name: Build matrix
        id: set-matrix
        run: |
          RUN_ID=$(uuidgen || python3 -c "import uuid; print(uuid.uuid4())")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIER="${{ github.event.inputs.symbol_tier || 'tier_2' }}"
            echo "matrix={\"include\":[{\"tier\":\"$TIER\",\"label\":\"$TIER\"}]}" >> $GITHUB_OUTPUT
          elif [ "$(date +%u)" = "7" ]; then
            # Sunday — 5 exclusive parallel jobs for full coverage
            echo 'matrix={"include":[{"tier":"tier_1_exclusive","label":"tier_1"},{"tier":"tier_2_exclusive","label":"tier_2"},{"tier":"tier_3a","label":"tier_3a"},{"tier":"tier_3b","label":"tier_3b"},{"tier":"tier_3c","label":"tier_3c"}]}' >> $GITHUB_OUTPUT
          else
            # Weekdays — tier_2 (tier_1 + tier_2 combined, ~230 symbols)
            echo 'matrix={"include":[{"tier":"tier_2","label":"tier_2"}]}' >> $GITHUB_OUTPUT
          fi

  # ── Training shard jobs (parallel on Sunday) ──────────────────────
  train-lstm:
    name: Train LSTM (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    env:
      ML_RUN_ID: ${{ needs.plan.outputs.run_id }}
      ML_SHARD_NAME: ${{ matrix.label }}
      ML_TRIGGER_SOURCE: github_actions
      QUANTTRADE_API_BASE: ${{ secrets.QUANTTRADE_API_BASE_URL || 'https://www.quanttrade.us' }}
      ML_CALLBACK_SECRET: ${{ secrets.ML_CALLBACK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache parquet data
        uses: actions/cache@v4
        with:
          path: backend/ml/data_cache
          key: ml-data-cache-v5-${{ matrix.tier }}-${{ github.run_id }}
          restore-keys: |
            ml-data-cache-v5-${{ matrix.tier }}-
            ml-data-cache-v5-
            ml-data-cache-v4-

      - name: Cache feature store
        uses: actions/cache@v4
        with:
          path: backend/ml/feature_store_data
          key: ml-feature-store-v1-${{ matrix.tier }}-${{ github.run_id }}
          restore-keys: |
            ml-feature-store-v1-${{ matrix.tier }}-
            ml-feature-store-v1-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ml-v3-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-ml-v3-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run ML Training Shard
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
          ML_S3_BUCKET: "quanttrade-ml-artifacts"
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Run ID:    $ML_RUN_ID"
          echo "  Shard:     $ML_SHARD_NAME"
          echo "  Tier:      ${{ matrix.tier }}"
          echo "  Trigger:   $ML_TRIGGER_SOURCE"
          echo "═══════════════════════════════════════════════"
          python -m ml.train --config configs/train_default.yaml \
            --symbol-tier ${{ matrix.tier }} \
            ${{ github.event.inputs.epochs && format('--epochs {0}', github.event.inputs.epochs) || '' }}

      - name: Report results to Neon
        if: always()
        working-directory: ./backend
        run: |
          python3 - <<'PYEOF'
          import json, os, uuid, sys
          try:
              import requests
          except ImportError:
              print("requests not installed — skipping callback")
              sys.exit(0)

          api = os.environ.get("QUANTTRADE_API_BASE", "")
          secret = os.environ.get("ML_CALLBACK_SECRET", "")
          run_id = os.environ.get("ML_RUN_ID", "")
          shard_name = os.environ.get("ML_SHARD_NAME", "gha")
          shard_id = str(uuid.uuid4())

          if not api or not secret or not run_id:
              print("Missing QUANTTRADE_API_BASE, ML_CALLBACK_SECRET, or ML_RUN_ID — skipping callback")
              sys.exit(0)

          headers = {"X-ML-Callback-Secret": secret, "Content-Type": "application/json"}

          # Read train_summary.json written by train.py
          artifacts = []
          status = "failed"
          summary_path = "ml/train_summary.json"
          if os.path.exists(summary_path):
              try:
                  with open(summary_path) as f:
                      summary = json.load(f)
                  completed = [r for r in summary.get("results", []) if r.get("status") == "completed"]
                  status = "completed" if completed else "failed"
                  for r in completed:
                      m = r.get("test_metrics", {})
                      artifacts.append({
                          "symbol": shard_name.upper(),
                          "horizon": r["horizon"],
                          "directional_accuracy": m.get("directional_accuracy"),
                          "information_coefficient": m.get("information_coefficient"),
                          "hypothetical_sharpe": m.get("hypothetical_sharpe"),
                      })
              except Exception as e:
                  print(f"Warning: could not read train_summary.json: {e}")
          else:
              print("Warning: train_summary.json not found — reporting failure")

          print(f"Reporting to Neon: run={run_id[:8]} status={status} artifacts={len(artifacts)}")

          # POST batch-callback (auto-creates run record in Neon)
          try:
              resp = requests.post(
                  f"{api}/api/v1/internal/ml/batch-callback",
                  json={"run_id": run_id, "shard_id": shard_id, "shard_name": shard_name,
                        "status": status, "artifacts": artifacts},
                  headers=headers, timeout=30,
              )
              print(f"batch-callback: HTTP {resp.status_code}")
          except Exception as e:
              print(f"batch-callback error (non-fatal): {e}")

          # POST finalize
          try:
              resp = requests.post(
                  f"{api}/api/v1/internal/ml/runs/{run_id}/finalize",
                  json={"status": status,
                        "success_shards": 1 if status == "completed" else 0,
                        "failed_shards": 0 if status == "completed" else 1,
                        "total_shards": 1},
                  headers=headers, timeout=30,
              )
              print(f"finalize: HTTP {resp.status_code}")
          except Exception as e:
              print(f"finalize error (non-fatal): {e}")

          PYEOF

      - name: Training summary
        if: always()
        working-directory: ./backend
        run: |
          echo "=== Checkpoints ==="
          ls -lh ml/checkpoints/ 2>/dev/null || echo "No checkpoints"
          echo ""
          echo "=== Feature Store ==="
          ls ml/feature_store_data/*.parquet 2>/dev/null | wc -l | xargs echo "Symbols in feature store:"
          echo ""
          echo "=== Experiments ==="
          ls ml/experiments/ 2>/dev/null | wc -l | xargs echo "Total experiment runs:"

      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-checkpoints-${{ matrix.label }}-${{ github.run_id }}
          path: |
            backend/ml/checkpoints/
            backend/ml/registry/
          retention-days: 30

      - name: Upload feature store
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-feature-store-${{ matrix.label }}-${{ github.run_id }}
          path: backend/ml/feature_store_data/
          retention-days: 14

      - name: Upload data cache
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-data-cache-${{ matrix.label }}-${{ github.run_id }}
          path: backend/ml/data_cache/
          retention-days: 7

      - name: Upload experiment logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-experiments-${{ matrix.label }}-${{ github.run_id }}
          path: backend/ml/experiments/
          retention-days: 30
