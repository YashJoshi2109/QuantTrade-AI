name: ML Train Nightly

on:
  schedule:
    - cron: '0 3 * * 1-5'   # Weekdays 03:00 UTC — train tier_2 (~230 stocks)
    - cron: '0 3 * * 0'      # Sunday 03:00 UTC — full retrain via parallel tier jobs
  workflow_dispatch:
    inputs:
      symbol_tier:
        description: 'Symbol tier: tier_1 | tier_2 | tier_3 | all'
        default: 'tier_2'
      epochs:
        description: 'Override epochs (default from config)'
        default: ''
      force:
        description: 'Force retrain even without drift'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  # ── Determine which tiers to train ────────────────────────────────────
  plan:
    name: Plan training tiers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIER="${{ github.event.inputs.symbol_tier || 'tier_2' }}"
            # Single tier dispatch — run as one job
            echo "matrix={\"include\":[{\"tier\":\"$TIER\",\"label\":\"$TIER\"}]}" >> $GITHUB_OUTPUT
          elif [ "$(date +%u)" = "7" ]; then
            # Sunday — split into 3 parallel jobs by tier for faster execution
            echo 'matrix={"include":[{"tier":"tier_1","label":"tier_1"},{"tier":"tier_2","label":"tier_2"},{"tier":"tier_3","label":"tier_3"}]}' >> $GITHUB_OUTPUT
          else
            # Weekdays — tier_2 only (includes tier_1)
            echo 'matrix={"include":[{"tier":"tier_2","label":"tier_2"}]}' >> $GITHUB_OUTPUT
          fi

  # ── Training jobs (parallel on Sunday) ────────────────────────────────
  train-lstm:
    name: Train LSTM (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache parquet data
        uses: actions/cache@v4
        with:
          path: backend/ml/data_cache
          key: ml-data-cache-v4-${{ matrix.tier }}-${{ github.run_id }}
          restore-keys: |
            ml-data-cache-v4-${{ matrix.tier }}-
            ml-data-cache-v4-
            ml-data-cache-v3-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ml-v2-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-ml-v2-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run ML Pipeline (Feature Store + Train + Register)
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          echo "Training tier: ${{ matrix.tier }}"
          echo "Epochs override: ${{ github.event.inputs.epochs || 'default' }}"
          python -m ml.train --config configs/train_default.yaml \
            --symbol-tier ${{ matrix.tier }} \
            ${{ github.event.inputs.epochs && format('--epochs {0}', github.event.inputs.epochs) || '' }}

      - name: Training summary
        if: always()
        working-directory: ./backend
        run: |
          echo "=== Checkpoints ==="
          ls -lh ml/checkpoints/ 2>/dev/null || echo "No checkpoints"
          echo ""
          echo "=== Feature Store ==="
          ls ml/feature_store_data/*.parquet 2>/dev/null | wc -l | xargs echo "Symbols in feature store:"
          echo ""
          echo "=== Experiments ==="
          ls ml/experiments/ 2>/dev/null | wc -l | xargs echo "Total experiment runs:"

      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-checkpoints-${{ matrix.tier }}-${{ github.run_id }}
          path: |
            backend/ml/checkpoints/
            backend/ml/registry/
          retention-days: 30

      - name: Upload feature store
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-feature-store-${{ matrix.tier }}-${{ github.run_id }}
          path: backend/ml/feature_store_data/
          retention-days: 14

      - name: Upload data cache
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-data-cache-${{ matrix.tier }}-${{ github.run_id }}
          path: backend/ml/data_cache/
          retention-days: 7

      - name: Upload experiment logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-experiments-${{ matrix.tier }}-${{ github.run_id }}
          path: backend/ml/experiments/
          retention-days: 30
