name: ML Train Nightly

on:
  schedule:
    - cron: '0 3 * * 1-5'   # Weekdays 03:00 UTC — train tier_2 (~230 stocks)
    - cron: '0 3 * * 0'      # Sunday 03:00 UTC — full retrain via 5 parallel shard jobs
  workflow_dispatch:
    inputs:
      symbol_tier:
        description: 'Symbol tier: tier_1 | tier_2 | tier_3 | all | tier_1_exclusive | tier_2_exclusive | tier_3a | tier_3b | tier_3c'
        default: 'tier_2'
      epochs:
        description: 'Override epochs (default from config)'
        default: ''
      force:
        description: 'Force retrain even without drift'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: read

# Cancel any previously-queued run for the same trigger type.
# Without this, jobs pile up in the GHA queue (each waits 6h then auto-cancels).
concurrency:
  group: ml-train-nightly-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ── Determine training shards ─────────────────────────────────────
  plan:
    name: Plan training shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      run_id: ${{ steps.set-matrix.outputs.run_id }}
    steps:
      - name: Build matrix
        id: set-matrix
        run: |
          RUN_ID=$(uuidgen || python3 -c "import uuid; print(uuid.uuid4())")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIER="${{ github.event.inputs.symbol_tier || 'tier_2' }}"
            EPOCHS="${{ github.event.inputs.epochs || '20' }}"
            echo "matrix={\"include\":[{\"tier\":\"$TIER\",\"label\":\"$TIER\",\"max_epochs\":$EPOCHS}]}" >> $GITHUB_OUTPUT
          elif [ "$(date +%u)" = "7" ]; then
            # Sunday — 5 exclusive parallel jobs; per-tier epoch budgets fit within 6h timeout
            # tier_1: 30 sym ~2.5min/ep → 30ep×2h = 150min ✓
            # tier_2: 180 sym ~15min/ep  →  8ep×2h = 240min ✓
            # tier_3: 87 sym  ~7min/ep   → 12ep×2h = 168min ✓
            echo 'matrix={"include":[{"tier":"tier_1_exclusive","label":"tier_1","max_epochs":30},{"tier":"tier_2_exclusive","label":"tier_2","max_epochs":8},{"tier":"tier_3a","label":"tier_3a","max_epochs":12},{"tier":"tier_3b","label":"tier_3b","max_epochs":12},{"tier":"tier_3c","label":"tier_3c","max_epochs":12}]}' >> $GITHUB_OUTPUT
          else
            # Weekdays — tier_1_exclusive (30 mega-caps): fast run (<45min), meaningful daily signal
            echo 'matrix={"include":[{"tier":"tier_1_exclusive","label":"tier_1","max_epochs":30}]}' >> $GITHUB_OUTPUT
          fi

  # ── Training shard jobs (parallel on Sunday) ──────────────────────
  train-lstm:
    name: Train LSTM (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest  # TODO: revert to [self-hosted, ml] after Spot vCPU quota approved
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    env:
      ML_RUN_ID: ${{ needs.plan.outputs.run_id }}
      ML_SHARD_NAME: ${{ matrix.label }}
      ML_TRIGGER_SOURCE: github_actions
      QUANTTRADE_API_BASE: ${{ secrets.QUANTTRADE_API_BASE_URL || 'https://www.quanttrade.us' }}
      ML_CALLBACK_SECRET: ${{ secrets.ML_CALLBACK_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get cache date key
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache parquet data
        uses: actions/cache@v4
        with:
          path: backend/ml/data_cache
          # Daily key: same-day retries hit primary; next day falls back to restore-key (< 26h old → still fresh)
          key: ml-data-cache-v6-${{ matrix.tier }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ml-data-cache-v6-${{ matrix.tier }}-
            ml-data-cache-v5-${{ matrix.tier }}-

      - name: Cache feature store
        uses: actions/cache@v4
        with:
          path: backend/ml/feature_store_data
          key: ml-feature-store-v3-${{ matrix.tier }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ml-feature-store-v3-${{ matrix.tier }}-
            ml-feature-store-v2-${{ matrix.tier }}-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ml-v3-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-ml-v3-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Register training start in Neon
        working-directory: ./backend
        run: |
          python3 - <<'PYEOF'
          import json, os, uuid, sys, time
          try:
              import requests
          except ImportError:
              sys.exit(0)

          api    = os.environ.get("QUANTTRADE_API_BASE", "")
          secret = os.environ.get("ML_CALLBACK_SECRET", "")
          run_id = os.environ.get("ML_RUN_ID", "")
          shard_name = os.environ.get("ML_SHARD_NAME", "gha")
          shard_id   = os.environ.get("ML_SHARD_ID", str(uuid.uuid4()))

          if not api or not secret or not run_id:
              print("Missing env — skipping batch-start")
              sys.exit(0)

          # Resolve symbol count from tier constants (best-effort)
          try:
              sys.path.insert(0, ".")
              from ml.constants import SYMBOL_TIERS
              tier_raw = os.environ.get("ML_TIER", "tier_2")
              # strip _exclusive suffix: "tier_1_exclusive" → "tier_1"
              tier = tier_raw.replace("_exclusive", "")
              symbol_count = len(SYMBOL_TIERS.get(tier, SYMBOL_TIERS.get(tier_raw, [])))
          except Exception:
              symbol_count = 0

          headers = {"X-ML-Callback-Secret": secret, "Content-Type": "application/json"}
          try:
              resp = requests.post(
                  f"{api}/api/v1/internal/ml/batch-start",
                  json={"run_id": run_id, "shard_id": shard_id, "shard_name": shard_name,
                        "symbol_count": symbol_count, "horizons": [1, 7],
                        "batch_job_id": os.environ.get("GITHUB_RUN_ID", "")},
                  headers=headers, timeout=15,
              )
              print(f"batch-start: HTTP {resp.status_code}  symbols={symbol_count}")
          except Exception as e:
              print(f"batch-start error (non-fatal): {e}")

          # Persist shard_id for the callback step
          with open(os.environ.get("GITHUB_ENV", "/dev/null"), "a") as f:
              f.write(f"ML_SHARD_ID={shard_id}\n")
              f.write(f"ML_TRAIN_START_TS={int(time.time())}\n")
          PYEOF
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          ML_TIER: ${{ matrix.tier }}

      - name: Run ML Training Shard
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
          ML_S3_BUCKET: "quanttrade-ml-artifacts"
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Run ID:    $ML_RUN_ID"
          echo "  Shard:     $ML_SHARD_NAME"
          echo "  Tier:      ${{ matrix.tier }}"
          echo "  Trigger:   $ML_TRIGGER_SOURCE"
          echo "═══════════════════════════════════════════════"
          python -m ml.train --config configs/train_default.yaml \
            --symbol-tier ${{ matrix.tier }} \
            --epochs ${{ matrix.max_epochs }}

      - name: Report results to Neon
        if: always()
        working-directory: ./backend
        run: |
          python3 - <<'PYEOF'
          import json, os, uuid, sys, time
          try:
              import requests
          except ImportError:
              print("requests not installed — skipping callback")
              sys.exit(0)

          api        = os.environ.get("QUANTTRADE_API_BASE", "")
          secret     = os.environ.get("ML_CALLBACK_SECRET", "")
          run_id     = os.environ.get("ML_RUN_ID", "")
          shard_name = os.environ.get("ML_SHARD_NAME", "gha")
          shard_id   = os.environ.get("ML_SHARD_ID", str(uuid.uuid4()))
          start_ts   = int(os.environ.get("ML_TRAIN_START_TS", "0"))

          if not api or not secret or not run_id:
              print("Missing QUANTTRADE_API_BASE, ML_CALLBACK_SECRET, or ML_RUN_ID — skipping callback")
              sys.exit(0)

          headers = {"X-ML-Callback-Secret": secret, "Content-Type": "application/json"}

          # Read train_summary.json written by train.py
          artifacts    = []
          status       = "failed"
          symbol_count = 0
          summary_path = "ml/train_summary.json"
          summary      = {}
          if os.path.exists(summary_path):
              try:
                  with open(summary_path) as f:
                      summary = json.load(f)
                  symbol_count = summary.get("symbol_count", 0)
                  completed = [r for r in summary.get("results", []) if r.get("status") == "completed"]
                  status = "completed" if completed else "failed"
                  for r in completed:
                      m = r.get("test_metrics", {})
                      artifacts.append({
                          "symbol": shard_name.upper(),
                          "horizon": r["horizon"],
                          "directional_accuracy": m.get("directional_accuracy"),
                          "information_coefficient": m.get("information_coefficient"),
                          "hypothetical_sharpe": m.get("hypothetical_sharpe"),
                      })
              except Exception as e:
                  print(f"Warning: could not read train_summary.json: {e}")
          else:
              print("Warning: train_summary.json not found — reporting failure")

          runtime_seconds = (int(time.time()) - start_ts) if start_ts else None
          print(f"Reporting to Neon: run={run_id[:8]} status={status} symbols={symbol_count} artifacts={len(artifacts)} runtime={runtime_seconds}s")

          # POST batch-callback
          try:
              resp = requests.post(
                  f"{api}/api/v1/internal/ml/batch-callback",
                  json={"run_id": run_id, "shard_id": shard_id, "shard_name": shard_name,
                        "status": status, "symbol_count": symbol_count,
                        "runtime_seconds": runtime_seconds, "artifacts": artifacts},
                  headers=headers, timeout=30,
              )
              print(f"batch-callback: HTTP {resp.status_code}")
          except Exception as e:
              print(f"batch-callback error (non-fatal): {e}")

          # POST finalize
          try:
              resp = requests.post(
                  f"{api}/api/v1/internal/ml/runs/{run_id}/finalize",
                  json={"status": status,
                        "success_shards": 1 if status == "completed" else 0,
                        "failed_shards": 0 if status == "completed" else 1,
                        "total_shards": 1},
                  headers=headers, timeout=30,
              )
              print(f"finalize: HTTP {resp.status_code}")
          except Exception as e:
              print(f"finalize error (non-fatal): {e}")

          # POST promote — trigger auto-promotion when thresholds met
          # (GHA bypasses the SFN aggregator so we handle this inline)
          if status == "completed" and artifacts:
              das = [a["directional_accuracy"] for a in artifacts if a.get("directional_accuracy") is not None]
              ics = [a["information_coefficient"] for a in artifacts if a.get("information_coefficient") is not None]
              if das and ics:
                  avg_da = sum(das) / len(das)
                  avg_ic = sum(ics) / len(ics)
                  da_thresh = float(os.environ.get("PROMOTE_DA_THRESHOLD", "0.51"))
                  ic_thresh = float(os.environ.get("PROMOTE_IC_THRESHOLD", "-0.05"))
                  promo_status = "production" if (avg_da >= da_thresh and avg_ic >= ic_thresh) else "staging"
                  from datetime import datetime, timezone
                  version = f"v{datetime.now(timezone.utc).strftime('%Y%m%d_%H%M')}"
                  try:
                      resp = requests.post(
                          f"{api}/api/v1/internal/ml/runs/{run_id}/promote",
                          json={"model_version": version, "avg_da": avg_da, "avg_ic": avg_ic,
                                "promotion_status": promo_status},
                          headers=headers, timeout=30,
                      )
                      print(f"promote: HTTP {resp.status_code}  status={promo_status}  DA={avg_da:.3f}  IC={avg_ic:.3f}")
                  except Exception as e:
                      print(f"promote error (non-fatal): {e}")

                  # Write to Cloudflare KV so the CF Worker /predict endpoint gets the live model version
                  # Batch path uses auto-promote Lambda for this; GHA path must do it inline.
                  if promo_status == "production":
                      cf_account  = os.environ.get("CF_ACCOUNT_ID", "")
                      cf_ns       = os.environ.get("CF_KV_NAMESPACE_ID", "")
                      cf_token    = os.environ.get("CF_API_TOKEN", "")
                      if cf_account and cf_ns and cf_token:
                          now_iso = datetime.now(timezone.utc).isoformat()
                          for h in [1, 7]:
                              try:
                                  kv_resp = requests.put(
                                      f"https://api.cloudflare.com/client/v4/accounts/{cf_account}"
                                      f"/storage/kv/namespaces/{cf_ns}/values/model:lstm_h{h}:production",
                                      data=json.dumps({"version": version, "avg_da": round(avg_da, 4),
                                                       "avg_ic": round(avg_ic, 4), "promoted_at": now_iso}),
                                      headers={"Authorization": f"Bearer {cf_token}",
                                               "Content-Type": "application/json"},
                                      timeout=10,
                                  )
                                  print(f"CF KV h={h}: HTTP {kv_resp.status_code}")
                              except Exception as e:
                                  print(f"CF KV write h={h} (non-fatal): {e}")
                      else:
                          print("CF KV not configured — skipping KV write (set CF_ACCOUNT_ID, CF_KV_NAMESPACE_ID, CF_API_TOKEN secrets)")

          PYEOF

      - name: Evaluate model quality
        if: always()
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          # Produce model_card.json — exits 1 if any horizon fails hard floor
          # Non-zero exit marks the step failed but does NOT block artifact uploads
          python -m ml.model_evaluator \
            --summary ml/train_summary.json \
            --card ml/model_card.json || echo "EVAL_FAILED=true" >> $GITHUB_ENV

      - name: Training summary
        if: always()
        working-directory: ./backend
        run: |
          echo "=== Checkpoints ==="
          ls -lh ml/checkpoints/ 2>/dev/null || echo "No checkpoints"
          echo ""
          echo "=== Feature Store ==="
          ls ml/feature_store_data/*.parquet 2>/dev/null | wc -l | xargs echo "Symbols in feature store:"
          echo ""
          echo "=== Experiments ==="
          ls ml/experiments/ 2>/dev/null | wc -l | xargs echo "Total experiment runs:"
          echo ""
          echo "=== Model Card ==="
          cat ml/model_card.json 2>/dev/null || echo "No model card"

      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-checkpoints-${{ matrix.label }}-${{ github.run_id }}
          path: |
            backend/ml/checkpoints/
            backend/ml/registry/
          retention-days: 30

      - name: Upload feature store
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-feature-store-${{ matrix.label }}-${{ github.run_id }}
          path: backend/ml/feature_store_data/
          retention-days: 14

      - name: Upload data cache
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-data-cache-${{ matrix.label }}-${{ github.run_id }}
          path: backend/ml/data_cache/
          retention-days: 7

      - name: Upload experiment logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-experiments-${{ matrix.label }}-${{ github.run_id }}
          path: backend/ml/experiments/
          retention-days: 30

      - name: Upload model card
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-model-card-${{ matrix.label }}-${{ github.run_id }}
          path: backend/ml/model_card.json
          retention-days: 90

      # ── Post-training smoke test ────────────────────────────────
      # Hits production to confirm the endpoint is reachable + returns valid JSON.
      # continue-on-error: true — training is the concern here, not prod deployment.
      # 404 = prod not yet redeployed; that's a deployment issue, not a training issue.
      - name: Smoke test prediction endpoint
        if: success()
        continue-on-error: true
        env:
          QUANTTRADE_API_BASE: ${{ secrets.QUANTTRADE_API_BASE_URL || 'https://www.quanttrade.us' }}
        run: |
          echo "Smoke testing prediction endpoint..."
          MAX_RETRIES=5
          DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP=$(curl -s -o /tmp/pred_response.json -w "%{http_code}" \
              "${QUANTTRADE_API_BASE}/api/v1/predictions/AAPL?horizon=1" \
              --max-time 15)
            echo "Attempt $i: HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "=== Prediction response ==="
              cat /tmp/pred_response.json
              # Validate required fields exist
              python3 -c "
          import json, sys
          d = json.load(open('/tmp/pred_response.json'))
          required = ['symbol','horizon','predicted_return','predicted_direction','confidence','model_version']
          missing = [k for k in required if k not in d]
          if missing:
              print(f'MISSING FIELDS: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'OK: symbol={d[\"symbol\"]} dir={d[\"predicted_direction\"]} conf={d[\"confidence\"]} ver={d[\"model_version\"]}')
          "
              exit 0
            fi
            echo "Not 200 — waiting ${DELAY}s"
            sleep $DELAY
          done
          echo "Smoke test FAILED after $MAX_RETRIES attempts"
          exit 1

      # Eval gate: warns if model quality below floor but does NOT fail CI.
      # Promotion is already blocked by Lambda auto-promote thresholds.
      # CI passing = training pipeline ran correctly, not that model is production-ready.
      - name: Eval gate (informational)
        if: always()
        continue-on-error: true
        run: |
          if [ "$EVAL_FAILED" = "true" ]; then
            echo "::warning::Model eval gate: one or more horizons below DA/IC/Sharpe floor."
            echo "Model registered as STAGING only — Lambda will not promote to production."
            echo "Review model_card artifact for per-horizon metrics."
            exit 1
          fi
          echo "Eval gate OK — model meets production floors."
