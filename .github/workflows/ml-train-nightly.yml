name: ML Train Nightly

on:
  schedule:
    - cron: '0 3 * * 1-5'   # Weekdays 03:00 UTC — train tier_2 (180 stocks)
    - cron: '0 3 * * 0'      # Sunday 03:00 UTC — full retrain (all 300 stocks)
  workflow_dispatch:
    inputs:
      symbol_tier:
        description: 'Symbol tier: tier_1 | tier_2 | tier_3 | all'
        default: 'all'
      epochs:
        description: 'Override epochs (default: 80)'
        default: ''
      force:
        description: 'Force retrain even without drift'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  train-lstm:
    name: Train LSTM predictors
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache parquet data
        uses: actions/cache@v4
        with:
          path: backend/ml/data_cache
          key: ml-data-cache-v3-${{ github.run_id }}
          restore-keys: |
            ml-data-cache-v3-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ml-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-ml-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Determine symbol tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tier=${{ github.event.inputs.symbol_tier || 'all' }}" >> $GITHUB_OUTPUT
          elif [ "$(date +%u)" = "7" ]; then
            echo "tier=all" >> $GITHUB_OUTPUT
          else
            echo "tier=tier_2" >> $GITHUB_OUTPUT
          fi

      - name: Run ML Pipeline (Feature Store + Train + Register)
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          echo "Training with tier: ${{ steps.tier.outputs.tier }}"
          python -m ml.train --config configs/train_default.yaml \
            --symbol-tier ${{ steps.tier.outputs.tier }} \
            ${{ github.event.inputs.epochs && format('--epochs {0}', github.event.inputs.epochs) || '' }}

      - name: List trained checkpoints
        working-directory: ./backend
        run: |
          echo "=== Checkpoints ==="
          ls -lh ml/checkpoints/ || echo "No checkpoints"
          echo ""
          echo "=== Feature Store ==="
          ls ml/feature_store_data/*.parquet 2>/dev/null | wc -l | xargs echo "Symbols in feature store:"
          echo ""
          echo "=== Experiments ==="
          ls ml/experiments/ 2>/dev/null | wc -l | xargs echo "Total experiment runs:"

      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: ml-checkpoints-${{ github.run_id }}
          path: |
            backend/ml/checkpoints/
            backend/ml/registry/
          retention-days: 30

      - name: Upload feature store
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-feature-store-${{ github.run_id }}
          path: backend/ml/feature_store_data/
          retention-days: 14

      - name: Upload data cache
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-data-cache-${{ github.run_id }}
          path: backend/ml/data_cache/
          retention-days: 7

      - name: Upload experiment logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-experiments-${{ github.run_id }}
          path: backend/ml/experiments/
          retention-days: 30
