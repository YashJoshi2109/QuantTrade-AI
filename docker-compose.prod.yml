
# Production stack: expects a host file `.env` next to this compose file (e.g. /opt/quanttrade/.env).
# Do not put secrets in the image — use env_file + environment below. See deploy/.env.production.template.

services:
  nginx:
    image: nginx:stable-alpine
    container_name: quanttrade-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - quanttrade-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis: using AWS ElastiCache (quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379)
  # In-container Redis removed — ElastiCache provides persistence, better perf, separate resources.

  frontend:
    image: ghcr.io/yashjoshi2109/quanttrade-frontend:latest
    container_name: quanttrade-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=
      # Server-side Next routes call Yahoo via backend (Yahoo often blocks Next/AWS egress directly)
      - BACKEND_INTERNAL_URL=http://backend:8000
      # Server-side Next routes (e.g. /api/ai-analysis) use OPENROUTER_API_KEY; client copilot uses NEXT_PUBLIC_*
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NEXT_PUBLIC_OPENROUTER_API_KEY=${NEXT_PUBLIC_OPENROUTER_API_KEY:-}
      # Cloudflare Turnstile CAPTCHA
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      # Live visitor heartbeat Worker
      - NEXT_PUBLIC_LIVE_VISITORS_WORKER_URL=${NEXT_PUBLIC_LIVE_VISITORS_WORKER_URL:-https://quanttrade-live-visitors.yashjosh7486.workers.dev}
      # Stock market data API keys (server-side Next.js routes)
      - FMP_API_KEY=${FMP_API_KEY:-}
      - TWELVE_DATA_API_KEY=${TWELVEDATA_API_KEY:-}
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      - APILAYER_CURRENCY_KEY=${APILAYER_CURRENCY_KEY:-}
      - MARKETSTACK_API_KEY=${MARKETSTACK_API_KEY:-}
      - OPENFIGI_API_KEY=${OPENFIGI_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - quanttrade-network

  backend:
    image: ghcr.io/yashjoshi2109/quanttrade-backend:latest
    container_name: quanttrade-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LOCAL_STORAGE_PATH=/tmp/storage
      - APP_URL=https://www.quanttrade.us
      - BILLING_PORTAL_RETURN_URL=https://www.quanttrade.us/settings
      - ALLOWED_ORIGINS=https://www.quanttrade.us,https://quanttrade.us
      # WebAuthn: registrable domain as rp_id so credentials work from www (and apex after redirect)
      - WEBAUTHN_RP_ID=quanttrade.us
      - WEBAUTHN_ORIGIN=https://www.quanttrade.us
      - WEBAUTHN_ORIGINS=https://www.quanttrade.us,https://quanttrade.us
      - REDIS_URL=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
      - CELERY_BROKER_URL=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
      - CELERY_RESULT_BACKEND=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
      - AWS_REGION=us-east-2
      - AWS_SECRET_NAME=quanttrade/backend
      # ── Stock Market Data APIs ──────────────────────────────────────
      - FMP_API_KEY=${FMP_API_KEY:-}
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY:-}
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      - MARKETSTACK_API_KEY=${MARKETSTACK_API_KEY:-}
      - OPENFIGI_API_KEY=${OPENFIGI_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - SEC_API_KEY=${SEC_API_KEY:-}
      # ── Alpaca Markets (free historical data + US quotes) ──────────────
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      # ── Robinhood (US quotes fallback) ─────────────────────────────────
      - ROBINHOOD_USERNAME=${ROBINHOOD_USERNAME:-}
      - ROBINHOOD_PASSWORD=${ROBINHOOD_PASSWORD:-}
      - ROBINHOOD_MFA_CODE=${ROBINHOOD_MFA_CODE:-}
      # ── Public.com (real-time quotes, option chains) ───────────────────
      - PUBLIC_API_SECRET_KEY=${PUBLIC_API_SECRET_KEY:-}
      # ── Global Monitor API Keys ─────────────────────────────────────
      - GUARDIAN_API_KEY=${GUARDIAN_API_KEY:-test}
      - ACLED_API_KEY=${ACLED_API_KEY:-}
      - ACLED_EMAIL=${ACLED_EMAIL:-}
      - ACLED_PASSWORD=${ACLED_PASSWORD:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - EIA_API_KEY=${EIA_API_KEY:-}
      - CLOUDFLARE_RADAR_TOKEN=${CLOUDFLARE_RADAR_TOKEN:-}
      - CLOUDFLARE_LIVE_VISITORS_URL=${CLOUDFLARE_LIVE_VISITORS_URL:-https://quanttrade-live-visitors.yashjosh7486.workers.dev}
      - CLOUDFLARE_ZONE_TAG=${CLOUDFLARE_ZONE_TAG:-4820e62920a4a8bbe1985afffa6d8b70}
      - CLOUDFLARE_ANALYTICS_TOKEN=${CLOUDFLARE_ANALYTICS_TOKEN:-}
      - LIVE_VISITORS_SOURCE=${LIVE_VISITORS_SOURCE:-auto}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NASA_API_KEY=${NASA_API_KEY:-}
      - NASA_FIRMS_API_KEY=${NASA_FIRMS_API_KEY:-}
      - USGS_API_KEY=${USGS_API_KEY:-}
      - USGS_API_KEY=${USGS_API_KEY:-}
      # Email / Auth (Brevo; optional Resend — verify senders in each dashboard)
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-QuantTrade AI <noreply@quanttrade.us>}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # ElevenLabs game audio
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      - ELEVENLABS_VOICE_NARRATOR=${ELEVENLABS_VOICE_NARRATOR:-}
      - ELEVENLABS_VOICE_KNIGHT=${ELEVENLABS_VOICE_KNIGHT:-}
      - ELEVENLABS_VOICE_SCHOLAR=${ELEVENLABS_VOICE_SCHOLAR:-}
      - ELEVENLABS_VOICE_MERCHANT=${ELEVENLABS_VOICE_MERCHANT:-}
      - ELEVENLABS_VOICE_NOBLE=${ELEVENLABS_VOICE_NOBLE:-}
      - ELEVENLABS_VOICE_SAGE=${ELEVENLABS_VOICE_SAGE:-}
      # Stripe Connect
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_CONNECT_THIN_WEBHOOK_SECRET=${STRIPE_CONNECT_THIN_WEBHOOK_SECRET:-}
      - STRIPE_CONNECT_SUBSCRIPTION_PRICE_ID=${STRIPE_CONNECT_SUBSCRIPTION_PRICE_ID:-}
      # Neon Auth
      - NEON_AUTH_URL=${NEON_AUTH_URL:-}
      - NEON_AUTH_JWKS_URL=${NEON_AUTH_JWKS_URL:-}
      - NEON_AUTH_AUDIENCE=${NEON_AUTH_AUDIENCE:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 8
    networks:
      - quanttrade-network

  # ── Celery Worker — executes async tasks (ML drift, performance, data sync) ──
  celery-worker:
    image: ghcr.io/yashjoshi2109/quanttrade-backend:latest
    container_name: quanttrade-celery-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - .env
    environment:
      - LOCAL_STORAGE_PATH=/tmp/storage
      - REDIS_URL=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
      - CELERY_BROKER_URL=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
      - CELERY_RESULT_BACKEND=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
      - AWS_REGION=us-east-2
      - AWS_SECRET_NAME=quanttrade/backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    networks:
      - quanttrade-network

  # ── Celery Beat — periodic task scheduler (drift 6h, performance daily) ──
  celery-beat:
    image: ghcr.io/yashjoshi2109/quanttrade-backend:latest
    container_name: quanttrade-celery-beat
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M
    env_file:
      - .env
    environment:
      - LOCAL_STORAGE_PATH=/tmp/storage
      - REDIS_URL=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
      - CELERY_BROKER_URL=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
      - CELERY_RESULT_BACKEND=redis://quanttrade-redis.hkxtsb.0001.use2.cache.amazonaws.com:6379/0
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - quanttrade-network

volumes:
  nginx_cache:

networks:
  quanttrade-network:
    driver: bridge
