# ============================================
# QuantTrade AI - Nginx Production Configuration
# ============================================
# 
# Features:
#   - HTTPS with Let's Encrypt certificates
#   - HTTP to HTTPS redirect
#   - Reverse proxy to frontend (/) and backend (/api/)
#   - Security headers
#   - Gzip compression
#   - Extended timeouts for ML endpoints
# ============================================

# Worker processes (auto = number of CPU cores)
worker_processes auto;

# Error log
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml;
    gzip_min_length 1000;

    # Security headers (applied to all responses)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API response microcache — collapses thundering herd via proxy_cache_lock
    proxy_cache_path /var/cache/nginx/api levels=1:2
                     keys_zone=api_cache:10m max_size=100m
                     inactive=10m use_temp_path=off;

    # Real client IP behind Cloudflare. Without this $remote_addr is the CF edge,
    # so limit_req (below) shared one bucket across every visitor routed through
    # the same edge. Only Cloudflare ranges may set CF-Connecting-IP; a request
    # that reaches the origin directly keeps its own address. The backend limiter
    # (app/middleware/rate_limit.py) does the same walk on X-Forwarded-For.
    # Ranges: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Rate limiting zones (keyed on the real client IP set above)
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;
    # /api/v1/system/status (1 poll/s per tab; several tabs behind one NAT)
    limit_req_zone $binary_remote_addr zone=status_limit:10m rate=10r/s;

    # Upstream definitions
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name quanttrade.us www.quanttrade.us localhost;

        # Health check endpoint (for Docker/deployment checks)
        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Internal ML callbacks from AWS Batch/Fargate (bypass Cloudflare via private IP)
        location /api/v1/internal/ml/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://www.quanttrade.us$request_uri;
        }
    }

    # Redirect non-www to www
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name quanttrade.us;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/quanttrade.us/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/quanttrade.us/privkey.pem;

        # Redirect to www
        return 301 https://www.quanttrade.us$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.quanttrade.us;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/quanttrade.us/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/quanttrade.us/privkey.pem;

        # SSL configuration (modern)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # HSTS — enforce HTTPS for 1 year (Cloudflare also sets this at edge)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Client body size (for file uploads)
        client_max_body_size 10M;

        # Model index / AI basket pipeline can run 30–120s+ (universe collect + scoring).
        # Default /api/ timeout below is 60s — nginx would return 504 first.
        # If you use Cloudflare in front, free/proxy read timeout is ~100s unless bypassed.
        location /api/v1/model-index/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;

            # Cache batch/index responses (backend caches for 2min)
            proxy_cache api_cache;
            proxy_cache_valid 200 120s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_background_update on;
            proxy_cache_key "$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
            # Bypass cache for authenticated requests: the browser authenticates
            # with the httpOnly qt_access_token cookie, not an Authorization header.
            proxy_cache_bypass $http_authorization $cookie_qt_access_token;
            proxy_no_cache $http_authorization $cookie_qt_access_token;
        }

        # SSE stream — no buffering, no caching, long timeout
        location /api/v1/internal/ml/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            add_header X-Accel-Buffering no always;
        }

        # Copilot answer stream (SSE). Deep questions run many tools: worst case
        # ~5 min (prefetch waves + up to 6 model rounds + a repair pass). The
        # backend sends a `heartbeat` event after 15s of silence, so the read
        # timeout only has to outlast one silent gap; 600s is a generous cap.
        # No buffering, no caching, no gzip (gzip would batch the events).
        # Browser path: /api/copilot/stream (Next.js route) -> backend:8000.
        location = /api/copilot/stream {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            add_header X-Accel-Buffering no always;

            limit_req zone=api_limit burst=20 nodelay;
        }

        # Direct backend path (API clients, eval runner --base-url).
        location = /api/v1/copilot/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            add_header X-Accel-Buffering no always;

            limit_req zone=api_limit burst=20 nodelay;
        }

        # WebSockets (/api/v1/ws/news, /api/v1/ws/ideas, ...) -> Backend.
        # The generic /api/v1/ block below clears the Connection header (for
        # upstream keepalive) and caches, which strips the Upgrade handshake:
        # the backend then sees a plain GET and answers 404. Forward the
        # Upgrade/Connection headers here and never cache or buffer.
        location /api/v1/ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # Live system status: every open tab polls this once per second. The
        # body is identical for every caller (no user data), so it is cached
        # for exactly 1s (backend sends Cache-Control: max-age=1) even for
        # signed-in users, and concurrent misses collapse into one upstream
        # request. No proxy_cache_use_stale: an outage must never be hidden
        # behind a cached "all systems normal". Own rate-limit bucket so the
        # poll never competes with page traffic in api_limit.
        location = /api/v1/system/status {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            proxy_cache api_cache;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_key "$uri";
            proxy_cache_methods GET HEAD;
            add_header X-Cache-Status $upstream_cache_status;

            limit_req zone=status_limit burst=10 nodelay;
        }

        # Backend API routes -> Backend (with microcache)
        # Only /api/v1/ goes to the Python backend. Other /api/* routes
        # (e.g. /api/quotes, /api/stats, /api/currencies) are Next.js
        # server-side routes and must reach the frontend container.
        location /api/v1/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Connection settings
            proxy_set_header Connection "";

            # Timeouts — match backend gunicorn timeout (300s)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # ── Microcache: respect Cache-Control from backend ──
            proxy_cache api_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_background_update on;
            proxy_cache_key "$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
            # Bypass cache for authenticated requests. The browser sends the
            # httpOnly qt_access_token cookie (no Authorization header); without
            # the cookie check, a logged-in user's 200 was cached by URL and
            # replayed to anonymous callers.
            proxy_cache_bypass $http_authorization $cookie_qt_access_token;
            proxy_no_cache $http_authorization $cookie_qt_access_token;
            proxy_cache_methods GET HEAD;

            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Stripe webhook needs longer timeout
        location /api/v1/billing/webhook {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeout for webhook processing
            proxy_read_timeout 120s;
        }

        # Health check endpoint (no auth, fast)
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Frontend (Next.js) - all other routes
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for HMR in dev, or future features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Static assets caching. ^~ so the public-image regex below never
        # captures /_next/static/media/*.png (those keep the 1y immutable policy).
        location ^~ /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Cache static assets
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Optimized images (next/image). Next sets Cache-Control from
        # images.minimumCacheTTL (30d); variants are keyed by url+w+q.
        location ^~ /_next/image {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Self-hosted globe textures (public/globe): static, rarely change.
        location ^~ /globe/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_hide_header Cache-Control;
            expires 30d;
            access_log off;
        }

        # Top-level public images (/logo.png, /logo-sm.webp, /favicon.png, ...).
        # Unhashed names, so a week rather than immutable. Only matches a single
        # path segment, so /api/... and app routes are never caught here.
        # No add_header in this block: server-level security headers still apply.
        location ~* ^/[^/]+\.(?:png|jpe?g|gif|webp|avif|svg)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_hide_header Cache-Control;
            expires 7d;
            access_log off;
        }

        # Favicon and robots
        location = /favicon.ico {
            proxy_pass http://frontend;
            expires 1d;
            access_log off;
        }

        location = /robots.txt {
            proxy_pass http://frontend;
            expires 1d;
            access_log off;
        }
    }
}
