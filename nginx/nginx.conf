# ============================================
# QuantTrade AI - Nginx Production Configuration
# ============================================
# 
# Features:
#   - HTTPS with Let's Encrypt certificates
#   - HTTP to HTTPS redirect
#   - Reverse proxy to frontend (/) and backend (/api/)
#   - Security headers
#   - Gzip compression
#   - Extended timeouts for ML endpoints
# ============================================

# Worker processes (auto = number of CPU cores)
worker_processes auto;

# Error log
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml;
    gzip_min_length 1000;

    # Security headers (applied to all responses)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API response microcache — collapses thundering herd via proxy_cache_lock
    proxy_cache_path /var/cache/nginx/api levels=1:2
                     keys_zone=api_cache:10m max_size=100m
                     inactive=10m use_temp_path=off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

    # Upstream definitions
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name quanttrade.us www.quanttrade.us localhost;

        # Health check endpoint (for Docker/deployment checks)
        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Internal ML callbacks from AWS Batch/Fargate (bypass Cloudflare via private IP)
        location /api/v1/internal/ml/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://www.quanttrade.us$request_uri;
        }
    }

    # Redirect non-www to www
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name quanttrade.us;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/quanttrade.us/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/quanttrade.us/privkey.pem;

        # Redirect to www
        return 301 https://www.quanttrade.us$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.quanttrade.us;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/quanttrade.us/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/quanttrade.us/privkey.pem;

        # SSL configuration (modern)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # HSTS — enforce HTTPS for 1 year (Cloudflare also sets this at edge)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Client body size (for file uploads)
        client_max_body_size 10M;

        # Model index / AI basket pipeline can run 30–120s+ (universe collect + scoring).
        # Default /api/ timeout below is 60s — nginx would return 504 first.
        # If you use Cloudflare in front, free/proxy read timeout is ~100s unless bypassed.
        location /api/v1/model-index/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;

            # Cache batch/index responses (backend caches for 2min)
            proxy_cache api_cache;
            proxy_cache_valid 200 120s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_background_update on;
            proxy_cache_key "$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;
        }

        # Backend API routes -> Backend (with microcache)
        # Only /api/v1/ goes to the Python backend. Other /api/* routes
        # (e.g. /api/quotes, /api/stats, /api/currencies) are Next.js
        # server-side routes and must reach the frontend container.
        location /api/v1/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Connection settings
            proxy_set_header Connection "";

            # Timeouts — match backend gunicorn timeout (300s)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # ── Microcache: respect Cache-Control from backend ──
            proxy_cache api_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_background_update on;
            proxy_cache_key "$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
            # Bypass cache for authenticated requests
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;
            proxy_cache_methods GET HEAD;

            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Stripe webhook needs longer timeout
        location /api/v1/billing/webhook {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeout for webhook processing
            proxy_read_timeout 120s;
        }

        # Health check endpoint (no auth, fast)
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Frontend (Next.js) - all other routes
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for HMR in dev, or future features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Static assets caching
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Cache static assets
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Favicon and robots
        location = /favicon.ico {
            proxy_pass http://frontend;
            expires 1d;
            access_log off;
        }

        location = /robots.txt {
            proxy_pass http://frontend;
            expires 1d;
            access_log off;
        }
    }
}
